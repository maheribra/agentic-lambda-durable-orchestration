AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Agentic application using AWS Lambda Durable Functions

Resources:

  DurableAgentWorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentic-document-review-durable
      Runtime: python3.13
      Handler: workflows/multi_step_reasoning.handler
      CodeUri: .
      MemorySize: 1024
      Timeout: 900

      DurableConfig:
        ExecutionTimeout: 3600
        RetentionPeriodInDays: 7

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy

      AutoPublishAlias: prod

Outputs:

  FunctionArn:
    Description: Durable function ARN
    Value: !GetAtt DurableAgentWorkflowFunction.Arn

  AliasArn:
    Description: Durable function alias ARN
    Value: !Ref DurableAgentWorkflowFunction.Alias